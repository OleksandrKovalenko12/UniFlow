<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniFlow</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- If you add any scoped CSS files, uncomment the following to load them
    <link href="UniFlow.Client.styles.css" rel="stylesheet" /> -->
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <!-- Before Blazor starts: plain HTML and CSS, no MudBlazor yet. The second logo is the
             light that runs over the first one, like a dynamic turn signal. -->
        <div class="app-loading">
            <div class="app-loading-logo">
                <img src="images/uniflow-logo.svg" alt="UniFlow" class="app-loading-base" />
                <div class="app-loading-glow">
                    <img src="images/uniflow-logo.svg" alt="" class="app-loading-light" />
                </div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Wystąpił nieoczekiwany błąd.
        <a href="." class="reload">Odśwież stronę</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
